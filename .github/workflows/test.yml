name: test
# Tests run on pull requests into dev (feature -> dev). dev -> main is the same code, so main runs nothing here:
# the only check on a main PR is guard-main (source must be dev). Keep the smoke checks out of main's required checks.
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Plugin files are in sync (run `node build-plugin.mjs` if this fails)
        run: node build-plugin.mjs --check
      - run: node test.mjs
